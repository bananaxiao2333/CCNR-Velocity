# CCNR 控制面地址（gRPC，host:port）
endpoint=127.0.0.1:8081

# control.v1 Bearer token；服务端未配置 CLIENT_TOKENS 时留空
token=

# 控制面不可达时是否放行新登录；生产默认 false（拒绝并给可读原因）
fail-open=false

# 单次 gRPC 调用超时，毫秒
timeout-millis=1000

# 准入调用单独放宽：首次要取 Casdoor token + 用户，1 秒会误判超时
authorize-timeout-millis=3000

# 准入结果缓存秒数；服务端响应的 cache_ttl_seconds 优先
cache-ttl-seconds=60

# 心跳间隔秒数（服务端在线判定窗口默认 180 秒）
heartbeat-seconds=60

# 遥测队列容量；满了丢新事件并告警
queue-capacity=8192

# 代理实例标识
proxy-id=velocity

# 未完成 CCNR Pass 设备码登录时，玩家先进这个服
# 该服必须在 velocity.toml 的 [servers] 里存在

auth-server=auth

# 通过后送往的游戏服
lobby-server=lobby

# ---------------------------------------------------------------------------
# 显示文案：玩家可见的每一句都在这里，可以整段翻译成别的语言。
# 删掉任意一行就回落到内置中文默认值；占位符不要翻译：
#   {code}    设备码
#   {minutes} 有效分钟数
# ---------------------------------------------------------------------------
message.login.title=━━━━━━━━ CCNR 通行证 ━━━━━━━━
message.login.heading=请完成验证以确认登录
message.login.button=[ 点击登录 ]
message.login.or-command=或者向 CCNR 行政服务发送下面的命令
message.login.command=/登录 {code}
message.login.footer=完成后将会自动通过验证（{minutes} 分钟内有效）
message.login.actionbar=[点击登录]
message.login.actionbar-hint=或 /登录 {code}
message.login.success=✔ 验证通过，正在进入游戏服…
message.login.hover-command=点击复制命令
message.error.not-verified=请先完成 CCNR Pass 登录后再进入游戏服务器
message.error.pass-unavailable=CCNR Pass 暂时不可用，请稍后再试
message.error.lobby-unavailable=游戏服暂不可用，请联系管理员
message.error.access-denied=你无法进入服务器
message.error.login-failed=CCNR Pass 登录失败或已过期
